name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: femstore/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: femstore/backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: femstore/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: femstore/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
