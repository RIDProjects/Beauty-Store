name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: femstore/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: femstore/backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: femstore/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: femstore/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false

  staging-health:
    name: Staging Health Check
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Check staging backend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_BACKEND_URL }}/health")
          if [ "$response" != "200" ]; then
            echo "Staging backend health check failed (HTTP $response)"
            exit 1
          fi
          echo "Staging backend healthy (HTTP $response)"
      - name: Check staging frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_FRONTEND_URL }}")
          if [ "$response" != "200" ] && [ "$response" != "302" ] && [ "$response" != "307" ] && [ "$response" != "308" ]; then
            echo "Staging frontend health check failed (HTTP $response)"
            exit 1
          fi
          echo "Staging frontend healthy (HTTP $response)"
